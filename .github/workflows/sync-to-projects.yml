name: Sync behavior contract to all projects

on:
  push:
    branches: [main]
    paths:
      - shared/06-agent-behavior.md   # only trigger when the contract itself changes

  workflow_dispatch:                   # allow manual run for one-off syncs

jobs:
  sync:
    name: Sync to ${{ matrix.project.repo }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false               # keep syncing other repos if one fails
      matrix:
        project:
          - repo: Recog-Omni/wheresmyjunk
            name: "Where's My Junk"
          - repo: Recog-Omni/website
            name: "Recog-Omni Website"
          - repo: Recog-Omni/sports-picker
            name: "Sports Picker"
          - repo: Recog-Omni/road_rager_2.0
            name: "Road Rager 2.0"

    steps:
      - name: Checkout agent-standards
        uses: actions/checkout@v4

      - name: Configure git
        run: |
          git config --global user.name  "agent-standards[bot]"
          git config --global user.email "agent-standards[bot]@users.noreply.github.com"

      - name: Clone target repo
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          gh repo clone "${{ matrix.project.repo }}" target -- --depth=1 --quiet

      - name: Create branch and copy contract
        run: |
          cd target
          BRANCH="chore/sync-agent-behavior-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"

          mkdir -p .context
          cp ../shared/06-agent-behavior.md .context/06-agent-behavior.md

          git add .context/06-agent-behavior.md

          # Only commit if something changed
          if git diff --cached --quiet; then
            echo "No changes to sync for ${{ matrix.project.repo }} — already up to date."
            echo "SKIP=true" >> "$GITHUB_ENV"
          else
            git commit -m "chore: sync agent behavior contract from agent-standards

Source commit: ${{ github.sha }}
https://github.com/Recog-Omni/agent-standards"
            echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
            echo "SKIP=false" >> "$GITHUB_ENV"
          fi

      - name: Push branch and open PR
        if: env.SKIP == 'false'
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          cd target
          git push origin "${{ env.BRANCH }}" --quiet

          # Check if a PR for this branch already exists
          EXISTING=$(gh pr list --head "${{ env.BRANCH }}" --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING already exists — skipping creation."
            exit 0
          fi

          gh pr create \
            --title "chore: sync agent behavior contract" \
            --body "## Summary

Automated sync of \`.context/06-agent-behavior.md\` from [Recog-Omni/agent-standards](https://github.com/Recog-Omni/agent-standards).

This file is the single source of truth for the senior engineer role, quality bar, and definition of done shared across all Recog-Omni projects.

**Source commit:** [\`${{ github.sha }}\`](https://github.com/Recog-Omni/agent-standards/commit/${{ github.sha }})

## Review checklist
- [ ] Diff looks correct (only \`.context/06-agent-behavior.md\` changed)
- [ ] No project-specific content was accidentally overwritten

🤖 Generated by [agent-standards sync workflow](https://github.com/Recog-Omni/agent-standards/blob/main/.github/workflows/sync-to-projects.yml)" \
            --head "${{ env.BRANCH }}"
